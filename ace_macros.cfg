
# =====================================
# ACE PRO - CAMBIO DE HERRAMIENTAS
# =====================================

[gcode_macro T0]
rename_existing: T800
description: ACE Pro - Bobina 0
gcode:
    ACE_CHANGEFILAMENT TOOL=0

[gcode_macro T1]
rename_existing: T801
description: ACE Pro - Bobina 1
gcode:
    ACE_CHANGEFILAMENT TOOL=1

[gcode_macro T2]
rename_existing: T802
description: ACE Pro - Bobina 2
gcode:
    ACE_CHANGEFILAMENT TOOL=2

[gcode_macro T3]
rename_existing: T803
description: ACE Pro - Bobina 3
gcode:
    ACE_CHANGEFILAMENT TOOL=3

[gcode_macro TR]
gcode:
    ACE_CHANGE_TOOL TOOL=-1



[gcode_macro PARKING_TO_TOOLHEAD]
gcode:
    # Check if slot is specified
    {% if params.INDEX is defined %}
        # Save the specified slot
        {% set target_index = params.INDEX|int %}
         # Report the start of parking
        RESPOND MSG="ACE: Iniciando estacionamiento de bobina {target_index}"
        # M18 Started parking filament for slot {target_index}

        # Start parking the specified slot
	    ACE_PARK_TO_TOOLHEAD INDEX={target_index}

    {% else %}
        # If slot is not specified, report an error
        {action_respond_info("Index is lost")}
        RESPOND TYPE=error MSG="Error INDEX is lost"
    {% endif %}

[gcode_macro STATUS_ACE]
gcode:
    ACE_STATUS
[gcode_macro HELP_ACE]
gcode:
    ACE_GET_HELP

[gcode_macro _ACE_PRE_TOOLCHANGE]
gcode:
    # No-op
    M118 Подготовка к смене филамента
     # M118 Preparation for filament change

[gcode_macro _ACE_POST_TOOLCHANGE]
gcode:
    # No-op
    M118 Действия после смены филамента
     # M118 Actions after filament change

[gcode_macro _ACE_PRE_INFINITYSPOOL]
gcode:
    # No-op
    M118 Подготовка к смене филамента
    # M118 Preparation for filament change

[gcode_macro _ACE_POST_INFINITYSPOOL]
gcode:
    # No-op
    M118 Действия после смены филамента
    # M118 Actions after filament change

[gcode_macro _ACE_RESET_INFINITYSPOOL]
gcode:
    # No-op
    SAVE_VARIABLE VARIABLE=ace_infsp_counter VALUE=1

[gcode_macro _ACE_ON_EMPTY_ERROR]
gcode:
    {action_respond_info("Spool is empty")}
    {% if printer.idle_timeout.state == "Printing" %}
        PAUSE
    {% endif %}

[gcode_macro FEED_ACE]
gcode:
    # Проверяем, задан ли слот
    # Check if slot is specified
    {% if params.INDEX and params.LENGTH is defined %}
        # Сохраняем заданный слот
        # Save the specified slot
        {% set target_index = params.INDEX|int %}
        {% set target_length = params.LENGTH|int %}
        {% if params.SPEED is defined %} 
            {% set target_speed = params.SPEED|int %}
        {% else %}
            {% set target_speed = 25 %}
        {% endif %}
         # Сообщаем о начале парковки
         # Report the start of parking
        RESPOND MSG="ACE: Alimentando slot {target_index}, {target_length} mm"
        # M118 Feed enabled for slot {target_index}

        # Запускаем парковку заданного слота
        # Start parking the specified slot
	    ACE_FEED INDEX={target_index} LENGTH={target_length} SPEED={target_speed}

    {% else %}
        # Если слот не задан выдаем ошибку
        # If slot is not specified, report an error
        {action_respond_info("Index or Length is lost")}
        RESPOND TYPE=error MSG="Error INDEX or LENGTH is lost"
    {% endif %}

[gcode_macro RETRACT_ACE]
gcode:
    # Check if slot is specified
    {% if params.INDEX and params.LENGTH is defined %}
        # Save the specified slot
        {% set target_index = params.INDEX|int %}
        {% set target_length = params.LENGTH|int %}
        {% if params.SPEED is defined %} 
            {% set target_speed = params.SPEED|int %}
        {% else %}
            {% set target_speed = 25 %}
        {% endif %}
         # Report the start of parking
        M118 La ranura de alimentación del filamento está habilitada. {target_index}.
        # M118 Feed enabled for slot {target_index}

        # Start parking the specified slot
	    ACE_RETRACT INDEX={target_index} LENGTH={target_length} SPEED={target_speed}

    {% else %}
        # Если слот не задан выдаем ошибку
        # If slot is not specified, report an error
        {action_respond_info("Index or Length is lost")}
        RESPOND TYPE=error MSG="Error INDEX or LENGTH is lost"
    {% endif %}

[gcode_macro ENABLE_FEED_ASSIST]
gcode:
    # Проверяем, задан ли слот
    # Check if slot is specified
    {% if params.INDEX is defined %}
         # Сохраняем заданный слот
        # Save the specified slot
        {% set target_index = params.INDEX|int %}
         # Сообщаем о начале парковки
         # Report the start of parking
        M118 Включена подача филамента слот {target_index}.
        # M18 Feed enabled for slot {target_index}

        # Запускаем парковку заданного слота
        # Start parking the specified slot
	    ACE_ENABLE_FEED_ASSIST INDEX={target_index}

    {% else %}
        # Если слот не задан выдаем ошибку
        # If slot is not specified, report an error
        {action_respond_info("Index is lost")}
        RESPOND TYPE=error MSG="Error INDEX is lost"
    {% endif %}


[gcode_macro DISABLE_FEED_ASSIST]
gcode:
    # Проверяем, задан ли слот
    {% if params.INDEX is defined %}
        # Сохраняем заданный слот
        {% set target_index = params.INDEX|int %}
         # Сообщаем о начале парковки
        M118 Выключена подача филамента слот {target_index}.

        # Запускаем парковку заданного слота
	    ACE_DISABLE_FEED_ASSIST INDEX={target_index}

    {% else %}
        # Если слот не задан выдаем ошибку
        {action_respond_info("Index is lost")}
        ACE_DISABLE_FEED_ASSIST INDEX=0
        G4 P1000
        ACE_DISABLE_FEED_ASSIST INDEX=1
        G4 P1000
        ACE_DISABLE_FEED_ASSIST INDEX=2
        G4 P1000
        ACE_DISABLE_FEED_ASSIST INDEX=3
        G4 P1000
    {% endif %}



[gcode_macro START_DRYING]
gcode:
    # Проверяем, задана ли температура
    # Check if temperature is specified
    {% if params.TEMP is defined %}
        # Сохраняем заданную температуру
        # Save the specified temperature
        {% set target_temp = params.TEMP|int %}
    {% else %}
        # Если температура не задана, используем значение по умолчанию (например, 55 градусов)
        # If temperature is not specified, use default value (e.g., 55 degrees)
        {% set target_temp = 55 %}
    {% endif %}
	# Проверяем, задано ли время
    # Check if time is specified
    {% if params.TIME is defined %}
         # Сохраняем заданное время в мин.
        # Save the specified time in minutes
        {% set target_time = params.TIME|int %}
    {% else %}
        # Если время не задано, используем значение по умолчанию (например, 120 минут)
        # If time is not specified, use default value (e.g., 120 minutes)
        {% set target_time = 120 %}
    {% endif %}
	
    # Сообщаем о начале сушки
    # Report the start of drying
    M118 Запущена сушка филамента температура {target_temp}°C продолжительность {target_time} минут.
    # M118 Started drying filament temperature {target_temp}°C duration {target_time} minutes

     # Запускаем сушку с заданными параметрами
    # Start drying with the specified parameters
	ACE_START_DRYING TEMP={target_temp} DURATION={target_time}

[gcode_macro STOP_DRYING]
gcode: 
    ACE_STOP_DRYING
    M118 Сушка филамента остановлена. Вентиляторы продолжат работу до полного остывания нагревателей.
    # M118 Filament drying stopped. Fans will continue to run until heaters are fully cooled.
    
# ==========================================
# ACE PRO - VARIABLES GLOBALES
# ==========================================

[gcode_macro ACE_GLOBAL]
variable_ace_ok: False
gcode:
    RESPOND MSG="ACE: Estado global disponible"


# ==========================================
# ACE PRO - VERIFICAR SENSOR
# SENSOR=0 -> debe estar OFF
# SENSOR=1 -> debe estar ON
# ==========================================

[gcode_macro ACE_CHECK]
description: Verificar sensor y actualizar estado global
gcode:
    {% set expected = params.SENSOR|default(-1)|int %}

    {% if expected not in [0, 1] %}
        {action_raise_error("ACE_CHECK: SENSOR debe ser 0 o 1")}
    {% endif %}

    {% set detected = printer["filament_switch_sensor filament_sensor"].filament_detected|int %}

    {% if detected == expected %}
        SET_GCODE_VARIABLE MACRO=ACE_GLOBAL VARIABLE=ace_ok VALUE=True
    {% else %}
        SET_GCODE_VARIABLE MACRO=ACE_GLOBAL VARIABLE=ace_ok VALUE=False
    {% endif %}


# ==========================================
# ACE PRO - EXIGIR RESULTADO CORRECTO
# ==========================================

[gcode_macro ACE_REQUIRE_OK]
description: Detener si la ultima operacion fallo
gcode:
    {% if not printer["gcode_macro ACE_GLOBAL"].ace_ok %}
        {action_raise_error("ACE: Operacion fallida. Secuencia cancelada")}
    {% endif %}


[gcode_macro ACE_PARKING]
description: Estacionar una bobina del ACE Pro
gcode:
    {% set tool = params.TOOL|default(-1)|int %}

    {% if tool < 0 or tool > 3 %}
        {action_raise_error("ACE_PARKING: TOOL debe ser 0-3")}
    {% endif %}

    ACE_CHANGE_TOOL TOOL={tool}
    ACE_PARKING_CHECK TOOL={tool}


[gcode_macro ACE_PARKING_CHECK]
description: Retroceder 60mm y verificar sensor libre
gcode:
    {% set tool = params.TOOL|default(-1)|int %}

    {% if tool < 0 or tool > 3 %}
        {action_raise_error("ACE_PARKING_CHECK: TOOL debe ser 0-3")}
    {% endif %}

    ACE_PARKING_FINISH TOOL={tool}

# ==========================================
# ACE PRO - ESTACIONAR TODAS LAS BOBINAS
# ==========================================
[gcode_macro ACE_PARKING_ALL]
description: Estacionar todas las bobinas disponibles
gcode:
    ACE_PRELOAD_ALL


# ==========================================
# ACE PRO - CARGAR DESDE PARKING
# ==========================================

[gcode_macro ACE_LOAD]
description: Cargar ACE Pro, purgar y limpiar boquilla
gcode:
    {% set tool = params.TOOL|int %}
    {% set temp = printer.extruder.temperature|float %}

    {% if temp < 200 %}
        M109 S200
    {% endif %}


    ACE_SYNC_LOAD TOOL={tool} LENGTH=20 SPEED=25

    # Extrusion de 60 mm a 8 mm/s
    M83
    G1 E60 F480

    # Limpieza original de Creality
    ACE_DISABLE_FEED_ASSIST INDEX={tool}
    G4 P500

    BOX_NOZZLE_CLEAN

    # Confirmar bobina activa
    ACE_SET_CURRENT_INDEX INDEX={tool}
# ==========================================
# ACE PRO - DESCARGAR Y ESTACIONAR
# ==========================================

[gcode_macro ACE_UNLOAD]
description: Cortar, descargar y estacionar filamento
gcode:
    {% set tool = printer.save_variables.variables.ace_current_index|default(-1)|int %}
    {% set temp = printer.extruder.temperature|float %}
    {% set target = printer.extruder.target|float %}

    {% if tool < 0 or tool > 3 %}
        {action_raise_error("ACE_UNLOAD: No hay herramienta cargada")}
    {% endif %}

    {% if temp <= 200 %}
        {% if target > 200 %}
            RESPOND MSG="ACE_UNLOAD: Esperando temperatura objetivo {target}C"
            M109 S{target}
        {% else %}
            RESPOND MSG="ACE_UNLOAD: Calentando hotend a 200C"
            M109 S200
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=ACE_GLOBAL VARIABLE=ace_ok VALUE=False

    BOX_MOVE_TO_CUT

    ACE_CHANGE_TOOL TOOL=-1

    ACE_UNLOAD_CHECK

[gcode_macro ACE_UNLOAD_CHECK]
description: Verificar descarga
gcode:
    ACE_CHECK SENSOR=0


# ==========================================
# ACE PRO - CAMBIAR FILAMENTO
# ==========================================



[gcode_macro ACE_CHANGEFILAMENT]
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set current = printer.save_variables.variables.ace_current_index|default(-1)|int %}

    {% if tool < 0 or tool > 3 %}
        {action_raise_error("ACE: Herramienta invalida. Usa TOOL=0 a TOOL=3")}

    {% elif current == tool %}
        {action_respond_info("ACE: T%d ya esta seleccionada. Continuando sin cambiar filamento." % tool)}

    {% else %}
        {% set homed = printer.toolhead.homed_axes %}
        {% set detected = printer["filament_switch_sensor filament_sensor"].filament_detected %}

        {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
            {action_raise_error("ACE: Primero debes hacer HOME XYZ")}

        {% elif current < 0 %}
            {action_raise_error("ACE: No hay herramienta ACE seleccionada")}

        {% elif not detected %}
            {action_raise_error("ACE: No hay filamento detectado")}

        {% else %}
            SAVE_GCODE_STATE NAME=ACE_CHANGE_STATE

            # Evitar pausa por runout durante el cambio de color
            SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

            # Cortar y descargar filamento anterior
            ACE_UNLOAD

            # Cargar nuevo filamento
            ACE_LOAD TOOL={tool}

            # Restaurar deteccion de runout
            SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1

            ACE_CHANGEFILAMENT_FINISH
        {% endif %}
    {% endif %}

[gcode_macro ACE_CHANGEFILAMENT_FINISH]
description: Verificar sensor y continuar impresion
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}

    {% if not sensor.filament_detected %}
        {action_raise_error("ACE_CHANGEFILAMENT: ERROR - sensor OFF, revisar filamento")}
    {% else %}
        RESPOND MSG="ACE_CHANGEFILAMENT: cambio completado correctamente"
        RESTORE_GCODE_STATE NAME=ACE_CHANGE_STATE MOVE=1
    {% endif %}

# ==========================================
# ACE PRO - CONSULTAR ESTADO GLOBAL
# ==========================================

[gcode_macro ACE_GET_STATUS]
gcode:
    {% set ok = printer["gcode_macro ACE_GLOBAL"].ace_ok %}

    RESPOND MSG="ACE: ace_ok={ok}"

